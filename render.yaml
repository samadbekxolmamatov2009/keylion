# Render Blueprint: one free web service running server.mjs (static site + API).
# Deploy: https://render.com/deploy?repo=https://github.com/samadbekxolmamatov2009/keylion
# Optional variables (GOOGLE_CLIENT_ID, GROQ_API_KEY, GROQ_MODEL) can be added later under
# Dashboard → tezlash → Environment.
services:
  - type: web
    name: tezlash
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
